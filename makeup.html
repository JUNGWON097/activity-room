<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메이크업 & 코디 · 액티비티룸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💄</text></svg>">
</head>
<body>
<header class="top" id="top"></header>
<main class="game-layout beauty-layout">
  <section class="stage-wrap">
    <div class="stage portrait beauty" id="face"></div>
    <div class="how" id="how"></div>
  </section>
  <aside class="board-panel tools">
    <div class="tabs" id="tabs"></div>
    <div id="opts"></div>
    <div class="tool-row">
      <button class="btn" type="button" id="rand">🎲 랜덤</button>
      <button class="btn" type="button" id="reset">처음으로</button>
      <button class="btn primary" type="button" id="save">📷 사진 저장</button>
    </div>
  </aside>
</main>
<script type="module" src="makeup.js?v=14"></script>
</body>
</html>
