<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 타자 · 액티비티룸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<link rel="stylesheet" href="style.css?v=41">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
</head>
<body>
<header class="top" id="top"></header>
<main class="game-layout">
  <section class="stage-wrap">
    <div class="stage space" id="stage">
      <canvas id="bg" class="space-bg" aria-hidden="true"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div class="screen" id="screen"></div>
    </div>
    <div class="how" id="how"></div>
  </section>
  <aside class="board-panel">
    <h2>🏆 랭킹</h2>
    <div class="board-tabs">
      <button type="button" class="on" data-id="typing">🛰️ 짧은 글 타수</button>
      <button type="button" data-id="typing-meteor">☄️ 운석 요격</button>
    </div>
    <div id="board"></div>
  </aside>
</main>
<script type="module" src="typing.js?v=41"></script>
</body>
</html>
